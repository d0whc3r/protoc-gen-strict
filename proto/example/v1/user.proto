syntax = "proto3";

package example.v1;

import "buf/validate/validate.proto";

// User demonstrates standard buf.validate rules alongside custom CEL rules.
message User {
  // Opaque identifier, prefixed to make its origin obvious.
  string id = 1 [
    (buf.validate.field).string.min_len = 5,
    (buf.validate.field).string.max_len = 64,
    // Custom CEL rule: full form with id and failure message.
    (buf.validate.field).cel = {
      id: "user.id.prefix",
      message: "id must start with 'usr_'",
      expression: "this.startsWith('usr_')"
    }
  ];

  string email = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];

  string display_name = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_ ]+$"
  ];

  int32 age = 4 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.lte = 130
  ];

  // Shorthand CEL form: expression only, id derived from the expression.
  int32 login_count = 5 [(buf.validate.field).cel_expression = "this >= 0"];

  repeated string roles = 6 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];

  Address address = 7;
}

// Address is referenced by User to exercise message-typed fields.
message Address {
  string country = 1 [(buf.validate.field).string.len = 2];
  string postal_code = 2 [(buf.validate.field).string.min_len = 3];
}
