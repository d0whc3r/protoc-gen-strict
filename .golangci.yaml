version: "2"
linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - errorlint
    - goconst
    - godot
    - importas
    - nilerr
    - promlinter
    - revive
    - sloglint
    - testifylint
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - goconst
      # The generators match and emit spec tokens (proto scalar names,
      # JSONSchema keywords, annotated_types names) out of lookup tables, where
      # a constant per token hides the table it belongs to.
      - path: internal/generator/
        linters:
          - goconst
    paths:
      - generated.*\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(github.com/d0whc3r/protoc-gen-strict) # Custom section: groups all imports with the specified Prefix (this component).
  exclusions:
    generated: lax
    paths:
      - generated.*\.go$
      - third_party$
      - builtin$
      - examples$
