name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # `make verify` compiles the generated TypeScript and imports the
      # generated Python, so both toolchains have to be here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # staticcheck, which `make lint` refuses to run without.
      - run: make tools

      # gofmt, go vet, staticcheck, buf lint, the hermetic golden tests, and a
      # real end-to-end `buf generate` over ./proto.
      - run: make check

      # The only check that catches an overlay that no longer resolves: it
      # type-checks against the real protoc-gen-es output and imports the real
      # generated Python. Needs network, npm and python3.
      - run: make verify

  commits:
    # release-please picks the next version off these messages, so a wrong type
    # ships a wrong version number. Every commit is linted, not just the PR
    # title, because merges here are not squashed: each one lands on `main`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # commitlint needs the base..head range, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
