name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Reads the conventional commits landed since the last tag, and keeps a
      # release PR open with the next version and the CHANGELOG entry. Merging
      # that PR is what tags and releases.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the push that merged the release PR.
      #
      # It lives in this workflow rather than a separate `on: push: tags` one:
      # release-please pushes the tag with GITHUB_TOKEN, and a tag pushed by
      # that token starts no further workflow, so the other workflow would
      # never fire.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          # GoReleaser reads the tag history to build the version.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The binaries the npm job publishes, and the GoReleaser metadata that
      # names them. A job of its own, so a failed publish can be re-run without
      # releasing a second time.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          name: dist
          path: |
            dist/artifacts.json
            dist/metadata.json
            dist/*/protoc-gen-strict*
          if-no-files-found: error

      # proxy.golang.org caches the version list for up to 30 minutes, so
      # `go install ...@latest` keeps resolving to the previous tag until it
      # expires. Requesting the new tag by name makes the proxy add it now.
      - if: ${{ steps.release.outputs.release_created }}
        run: curl -fsS "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/${TAG}.info"
        env:
          TAG: ${{ steps.release.outputs.tag_name }}

  npm:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm trades the OIDC token for a publish token, so
      # no NPM_TOKEN secret. Also signs the provenance.
      id-token: write
    steps:
      # npm/publish.mjs, and the LICENSE and READMEs it packs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # One package per command and platform, then the two command packages.
      # Skips every version already on npm, so a re-run resumes.
      - run: node npm/publish.mjs
