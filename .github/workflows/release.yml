name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Reads the conventional commits landed since the last tag, and keeps a
      # release PR open with the next version and the CHANGELOG entry. Merging
      # that PR is what tags and releases.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the push that merged the release PR.
      #
      # It lives in this workflow rather than a separate `on: push: tags` one:
      # release-please pushes the tag with GITHUB_TOKEN, and a tag pushed by
      # that token starts no further workflow, so the other workflow would
      # never fire.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          # GoReleaser reads the tag history to build the version.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
